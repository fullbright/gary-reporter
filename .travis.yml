language: python

python:
  - "3.8"
  - "3.9"
  - "3.10"
  - "3.11"

install:
  - pip install -r tests/test_requirements.txt
  - pip install -q coverage pytest-cov pytest-flakes
  - python setup.py -q install

script:
    - py.test tests/test_pocket.py --cov responses --cov-report term-missing --flakes
